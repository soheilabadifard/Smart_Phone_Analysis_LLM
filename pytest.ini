[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
markers =
    integration: integration tests that hit a real DB or LLM (skipped by default in CI fast pass)
    slow: tests that take > 1s
filterwarnings =
    ignore::DeprecationWarning:pkg_resources.*
    ignore::DeprecationWarning:passlib.*

# Coverage: run pytest with --cov to enable. Configured here so the run is
# reproducible whether invoked locally or in CI.
[coverage:run]
branch = True
source =
    backend/app
    newDatabase
    Data_cleaning
    database_eng
    generate_table_sql

[coverage:report]
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
    raise NotImplementedError
show_missing = True
skip_covered = False
precision = 1
